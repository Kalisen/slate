name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Universal build (arm64 + x86_64)
    runs-on: macos-latest
    env:
      DERIVED_DATA: build/DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          uname -m

      - name: Resolve Swift package dependencies (Sparkle)
        run: xcodebuild -resolvePackageDependencies -project Slate.xcodeproj -scheme Slate

      - name: Build Slate (Release, universal, ad-hoc signed)
        run: |
          xcodebuild build \
            -project Slate.xcodeproj \
            -scheme Slate \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            DEPLOYMENT_LOCATION=NO \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES

      - name: Verify the binary is native on Apple Silicon
        run: |
          APP="$DERIVED_DATA/Build/Products/Release/Slate.app"
          BIN="$APP/Contents/MacOS/Slate"
          echo "Slate archs:   $(lipo -archs "$BIN")"
          lipo -archs "$BIN" | grep -qw arm64  || { echo "::error::arm64 slice missing"; exit 1; }
          lipo -archs "$BIN" | grep -qw x86_64 || { echo "::error::x86_64 slice missing"; exit 1; }
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"
          test -f "$SPARKLE" || SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Sparkle"
          echo "Sparkle archs: $(lipo -archs "$SPARKLE")"
          lipo -archs "$SPARKLE" | grep -qw arm64 || { echo "::error::embedded Sparkle has no arm64 slice"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          otool -L "$BIN"

      - name: Build unit test bundle (XCTest)
        run: |
          xcodebuild build-for-testing \
            -project Slate.xcodeproj \
            -scheme Slate \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            DEPLOYMENT_LOCATION=NO \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES

      - name: Upload Slate.app
        uses: actions/upload-artifact@v4
        with:
          name: Slate-universal
          path: build/DerivedData/Build/Products/Release/Slate.app
          if-no-files-found: error
